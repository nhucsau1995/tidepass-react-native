# Stills for the README: one per key screen, taken at the top of each screen once its content
# is visible. Real taps on testIDs (no deep links). No clearState: the warm-up launch reset it.
# Every tap caps the settle wait: Live pills pulse and the hold countdown ticks every second.
appId: com.tidepass.app
---
- launchApp
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-onboarding
- tapOn:
    id: "get-started"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Welcome aboard"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-sign-in
- tapOn:
